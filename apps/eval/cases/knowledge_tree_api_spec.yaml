name: knowledge_tree_api_spec
tool: knowledge_tree
input:
  document_id: doc_api_spec
  instruction: "技術仕様書として整理して"
  chunks: ../testdata/api_spec_chunks.json
expect:
  schema_valid: true
  json:
    - path: $.items
      op: count_gte
      value: 3
    - path: $.items
      op: tree_depth_lte
      value: 4
    - path: $.items[*].title
      op: contains_all
      value:
        - "認証"
        - "エラーハンドリング"
