name: knowledge_tree_meeting_notes
tool: knowledge_tree
input:
  document_id: doc_meeting_notes
  instruction: "議事録として意思決定と未解決事項が分かるように整理して"
  chunks: ../testdata/meeting_notes_chunks.json
expect:
  schema_valid: true
  json:
    - path: $.items
      op: count_gte
      value: 3
    - path: $.items
      op: tree_depth_lte
      value: 4
    - path: $.items[*].title
      op: contains_all
      value:
        - "決定事項"
        - "未解決"
