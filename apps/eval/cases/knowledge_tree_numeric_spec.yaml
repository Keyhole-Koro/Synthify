name: knowledge_tree_numeric_spec
tool: knowledge_tree
input:
  document_id: doc_numeric_spec
  instruction: "数値制約と運用ルールが比較しやすい技術仕様として整理して"
  chunks: ../testdata/numeric_spec_chunks.json
expect:
  schema_valid: true
  json:
    - path: $.items
      op: count_gte
      value: 3
    - path: $.items
      op: tree_depth_lte
      value: 4
    - path: $.items[*].title
      op: contains_all
      value:
        - "SLO"
        - "容量"
