version: v2
plugins:
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
    out: internal/gen
    opt:
      - paths=source_relative
  - local:
      - go
      - run
      - connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.18.1
    out: internal/gen
    opt:
      - paths=source_relative
  - remote: buf.build/protocolbuffers/python:v36.0
    out: apps/local-provider/src
    include_imports: true
  - remote: buf.build/connectrpc/py:v0.11.1
    out: apps/local-provider/src
    opt:
      - protobuf=google
inputs:
  - directory: contracts/connectrpc
    paths:
      - contracts/connectrpc/synthify/localprovider/v1
