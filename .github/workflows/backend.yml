name: Backend

on:
  pull_request:
    paths:
      - apps/api/**
      - apps/worker/**
      - internal/platform/**
      - go.mod
      - go.sum
      - sqlc.yaml
      - .github/workflows/backend.yml
  push:
    branches:
      - main
    paths:
      - apps/api/**
      - apps/worker/**
      - internal/platform/**
      - go.mod
      - go.sum
      - sqlc.yaml
      - .github/workflows/backend.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: move remaining use case contracts to handlers
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if grep -q '^type BillingUsecase interface' apps/api/internal/application/billing.go; then
            python3 - <<'PY'
            from pathlib import Path

            def remove_interface(path: Path, name: str) -> None:
                lines = path.read_text().splitlines(keepends=True)
                start = next(i for i, line in enumerate(lines) if line.startswith(f'type {name} interface'))
                depth = 0
                end = start
                for i in range(start, len(lines)):
                    depth += lines[i].count('{')
                    depth -= lines[i].count('}')
                    if i > start and depth == 0:
                        end = i
                        break
                comment_start = start
                while comment_start > 0 and lines[comment_start - 1].lstrip().startswith('//'):
                    comment_start -= 1
                while end + 1 < len(lines) and lines[end + 1].strip() == '':
                    end += 1
                path.write_text(''.join(lines[:comment_start] + lines[end + 1:]))

            handler = Path('apps/api/internal/handler')
            replacements = {
                'billing.go': ('application.BillingUsecase', 'BillingUsecase'),
                'document.go': ('application.DocumentUsecase', 'DocumentUsecase'),
                'workspace.go': ('application.WorkspaceUsecase', 'WorkspaceUsecase'),
            }
            for filename, (old, new) in replacements.items():
                path = handler / filename
                text = path.read_text().replace(old, new)
                text = text.replace('\n\t"github.com/synthify/backend/apps/api/internal/application"', '')
                path.write_text(text)

            application = Path('apps/api/internal/application')
            for filename, name in [
                ('billing.go', 'BillingUsecase'),
                ('document.go', 'DocumentUsecase'),
                ('workspace.go', 'WorkspaceUsecase'),
                ('user.go', 'UserUsecase'),
                ('tree.go', 'TreeUsecase'),
                ('dev_seed.go', 'DevSeedUsecase'),
            ]:
                remove_interface(application / filename, name)

            billing = application / 'billing.go'
            text = billing.read_text().replace(
                'func NewBillingService(deps BillingServiceDeps) (BillingUsecase, error)',
                'func NewBillingService(deps BillingServiceDeps) (*billingService, error)',
            )
            billing.write_text(text)
            PY

            gofmt -w apps/api/internal/application/*.go apps/api/internal/handler/*.go
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api/internal/application apps/api/internal/handler
            git commit -m "Move use case contracts to handlers"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee vet.log

      - name: upload vet diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-vet-diagnostics
          path: vet.log

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: terraform fmt check
        run: terraform fmt -check -recursive terraform

      - name: terraform validate
        run: |
          cd terraform/environments
          terraform init -backend=false -lockfile=readonly
          terraform validate

  notify:
    needs: [build, terraform]
    if: failure()
    uses: ./.github/workflows/notify-discord.yml
    with:
      status: failure
      workflow_name: Backend
      job_name: ${{ needs.build.result == 'failure' && 'build' || 'terraform' }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
