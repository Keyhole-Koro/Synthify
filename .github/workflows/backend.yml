name: Backend

on:
  pull_request:
    paths:
      - apps/api/**
      - apps/eval/**
      - apps/worker/**
      - apps/eval/**
      - internal/platform/**
      # The gofmt step checks every Go file, apps/monitor and internal/gen
      # included, so a change to any of them runs it.
      - "**.go"
      - go.mod
      - go.sum
      - sqlc.yaml
      # The terraform job below is the only fmt/validate gate there is, so a
      # change under terraform/ has to be able to trigger it. Without this a
      # terraform-only PR merged with no validation at all, and the first thing
      # to parse it was `terraform apply` against a real environment.
      - terraform/**
      - .github/workflows/backend.yml
  push:
    branches:
      - main
    paths:
      - apps/api/**
      - apps/eval/**
      - apps/worker/**
      - apps/eval/**
      - internal/platform/**
      - "**.go"
      - go.mod
      - go.sum
      - sqlc.yaml
      - terraform/**
      - .github/workflows/backend.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # Every Go file in the repository, apps/monitor's module included.
      # Generated Go (protobuf, sqlc, the Firestore job-status types) starts
      # with the standard "Code generated ... DO NOT EDIT." line and is left
      # to its generator.
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=()
          while IFS= read -r file; do
            if ! grep -qE '^// Code generated .* DO NOT EDIT\.$' "$file"; then
              unformatted+=("$file")
            fi
          done < <(git ls-files '*.go' | xargs gofmt -l)
          if [ "${#unformatted[@]}" -gt 0 ]; then
            echo "::error::Not formatted with gofmt. Run 'gofmt -w' on these files and commit the result:"
            printf '%s\n' "${unformatted[@]}"
            exit 1
          fi
          echo "gofmt: every hand-written Go file is formatted"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: terraform fmt check
        run: terraform fmt -check -recursive terraform

      # CD applies terraform/environments as the deploy service account, which
      # cannot set project IAM, create service accounts or change Workload
      # Identity. Such a resource there passes validate and then fails the
      # deploy; it belongs in terraform/manual/iam, applied by hand.
      - name: no IAM in the CD stack that the deploy account cannot apply
        run: |
          if grep -rnE 'resource "google_(project_iam_[a-z_]+|service_account[a-z_]*|iam_workload_identity_pool[a-z_]*)"' \
              terraform/environments terraform/services terraform/modules; then
            echo "::error::Move the resources above to terraform/manual/iam: the deploy service account cannot apply them."
            exit 1
          fi

      # Single root reused across envs; validate is env-agnostic so one
      # backend-less init/validate covers stage and prod.
      - name: terraform validate
        run: |
          cd terraform/environments
          terraform init -backend=false -lockfile=readonly
          terraform validate

      # Stacks under terraform/manual are applied by hand, never by CD, so this
      # is the only check they get before someone runs them.
      - name: terraform validate (manual stacks)
        run: |
          set -euo pipefail
          for dir in terraform/manual/*/; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -lockfile=readonly -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

  notify:
    needs: [build, terraform]
    if: failure()
    uses: ./.github/workflows/notify-discord.yml
    with:
      status: failure
      workflow_name: Backend
      job_name: ${{ needs.build.result == 'failure' && 'build' || 'terraform' }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
