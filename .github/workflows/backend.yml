name: Backend

on:
  pull_request:
    paths:
      - apps/api/**
      - apps/eval/**
      - apps/worker/**
      - apps/eval/**
      - internal/platform/**
      - go.mod
      - go.sum
      - sqlc.yaml
      # The terraform job below is the only fmt/validate gate there is, so a
      # change under terraform/ has to be able to trigger it. Without this a
      # terraform-only PR merged with no validation at all, and the first thing
      # to parse it was `terraform apply` against a real environment.
      - terraform/**
      - .github/workflows/backend.yml
  push:
    branches:
      - main
    paths:
      - apps/api/**
      - apps/eval/**
      - apps/worker/**
      - apps/eval/**
      - internal/platform/**
      - go.mod
      - go.sum
      - sqlc.yaml
      - terraform/**
      - .github/workflows/backend.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.6.6

      - name: terraform fmt check
        run: terraform fmt -check -recursive terraform

      # Single root reused across envs; validate is env-agnostic so one
      # backend-less init/validate covers stage and prod.
      - name: terraform validate
        run: |
          cd terraform/environments
          terraform init -backend=false -lockfile=readonly
          terraform validate

  notify:
    needs: [build, terraform]
    if: failure()
    uses: ./.github/workflows/notify-discord.yml
    with:
      status: failure
      workflow_name: Backend
      job_name: ${{ needs.build.result == 'failure' && 'build' || 'terraform' }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
