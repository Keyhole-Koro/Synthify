name: Backend

on:
  pull_request:
    paths:
      - apps/api/**
      - apps/eval/**
      - apps/worker/**
      - apps/local-provider/**
      - contracts/**
      - apps/eval/**
      - internal/gen/**
      - internal/platform/**
      - buf.gen.local-provider.yaml
      - buf.yaml
      - go.mod
      - go.sum
      - sqlc.yaml
      # The terraform job below is the only fmt/validate gate there is, so a
      # change under terraform/ has to be able to trigger it. Without this a
      # terraform-only PR merged with no validation at all, and the first thing
      # to parse it was `terraform apply` against a real environment.
      - terraform/**
      - .github/workflows/backend.yml
  push:
    branches:
      - main
    paths:
      - apps/api/**
      - apps/eval/**
      - apps/worker/**
      - apps/local-provider/**
      - contracts/**
      - apps/eval/**
      - internal/gen/**
      - internal/platform/**
      - buf.gen.local-provider.yaml
      - buf.yaml
      - go.mod
      - go.sum
      - sqlc.yaml
      - terraform/**
      - .github/workflows/backend.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: bufbuild/buf-action@v1
        with:
          version: "1.72.0"
          setup_only: true

      - name: Protobuf contract checks
        run: |
          buf lint
          buf build
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            buf breaking --against ".git#commit=${{ github.event.pull_request.base.sha }}"
          fi
          buf generate
          buf generate --template buf.gen.local-provider.yaml
          git diff --exit-code -- internal/gen apps/web/src/gen apps/local-provider/src

      - name: install local provider runtime
        run: python -m pip install './apps/local-provider[dev]'

      - name: Python local provider checks
        run: |
          python -m ruff check apps/local-provider
          python -m ruff format --check apps/local-provider
          python -m unittest discover -s apps/local-provider/tests -p 'test_*.py' -v

      - name: Go race tests
        run: go test -race ./apps/worker/cmd/server ./apps/worker/pkg/worker/config ./apps/worker/pkg/worker/llm

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        env:
          SYNTHIFY_LOCAL_PROVIDER_PYTHON: python
        run: go test ./...

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: terraform fmt check
        run: terraform fmt -check -recursive terraform

      # Single root reused across envs; validate is env-agnostic so one
      # backend-less init/validate covers stage and prod.
      - name: terraform validate
        run: |
          cd terraform/environments
          terraform init -backend=false -lockfile=readonly
          terraform validate

  notify:
    needs: [build, terraform]
    if: failure()
    uses: ./.github/workflows/notify-discord.yml
    with:
      status: failure
      workflow_name: Backend
      job_name: ${{ needs.build.result == 'failure' && 'build' || 'terraform' }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
