name: Backend

on:
  pull_request:
    paths:
      - apps/api/**
      - apps/worker/**
      - internal/platform/**
      - go.mod
      - go.sum
      - sqlc.yaml
      - .github/workflows/backend.yml
  push:
    branches:
      - main
    paths:
      - apps/api/**
      - apps/worker/**
      - internal/platform/**
      - go.mod
      - go.sum
      - sqlc.yaml
      - .github/workflows/backend.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: fix migrated handler field references
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if grep -R -q 'h\.application' apps/api/internal/handler; then
            grep -RIl 'h\.application' apps/api/internal/handler | xargs sed -i 's/h\.application/h.service/g'
            gofmt -w apps/api/internal/handler/*.go
            if grep -R 'apps/api/internal/service' apps/api; then
              echo 'legacy service import remains' >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api/internal/handler
            git commit -m "Fix handler references after application migration"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee vet.log

      - name: upload vet diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-vet-diagnostics
          path: vet.log

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: terraform fmt check
        run: terraform fmt -check -recursive terraform

      - name: terraform validate
        run: |
          cd terraform/environments
          terraform init -backend=false -lockfile=readonly
          terraform validate

  notify:
    needs: [build, terraform]
    if: failure()
    uses: ./.github/workflows/notify-discord.yml
    with:
      status: failure
      workflow_name: Backend
      job_name: ${{ needs.build.result == 'failure' && 'build' || 'terraform' }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
