name: Web

on:
  pull_request:
  push:
    branches:
      - main

# Shared browser-app env. The API refuses to boot without a Stripe key and at
# least one price ID; E2E specs mock BillingService in the browser, so dummies
# suffice.
env:
  SKIP_ENV_VALIDATION: true
  NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
  NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-synthify
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-synthify.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-synthify.appspot.com
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
  NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:demo-synthify
  STRIPE_SECRET_KEY: sk_test_e2e_dummy
  STRIPE_PRO_PRICE_ID_JPY: price_e2e_dummy_jpy

jobs:
  # Static checks run once, in parallel with the e2e shards, instead of being
  # repeated inside every shard. None of lint/test/build feeds the e2e run (the
  # compose frontend builds itself), so they are independent work.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: bun run lint

      - name: Test
        working-directory: apps/web
        run: bun run test

      - name: Build
        working-directory: apps/web
        run: bun run build

  # Build everything the e2e stack runs, once, instead of letting every shard's
  # Docker Compose rebuild it from a cold cache.
  #
  # For Go: in-container the golang image's build cache lives in a named volume
  # that starts empty on each runner, so every shard paid a ~4-minute `go build`
  # floor. Static (CGO_ENABLED=0) binaries built here — cached natively by
  # setup-go — remove that floor from both shards.
  #
  # For web: the shards used to run `next dev`, which compiles each route on
  # first request. That is both slower and not what ships (apps/web is an
  # `output: 'export'` static site on Firebase Hosting), and the compile latency
  # showed up as flaky navigation timeouts. Export it once here and let the
  # shards serve the result.
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Build API and worker binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p .e2e-bin
          go build -buildvcs=false -o .e2e-bin/synthify-api ./apps/api/cmd/server
          go build -buildvcs=false -o .e2e-bin/synthify-worker ./apps/worker/cmd/server

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # NEXT_PUBLIC_* are baked into the bundle at build time, so this build has
      # to reproduce the environment the shards' compose stack would have given
      # `next dev`. The workflow-level env above covers most of it, but compose
      # also defaults these three (compose.yaml, frontend.environment) and they
      # are not optional: without them the bundle points the Firebase SDK at
      # real Firebase instead of the emulator and every signed-in spec fails.
      # Keep them in step with compose.yaml's defaults.
      - name: Build web static export
        working-directory: apps/web
        env:
          NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL: http://127.0.0.1:9099
          NEXT_PUBLIC_FIREBASE_FIRESTORE_EMULATOR_HOST: 127.0.0.1
          NEXT_PUBLIC_FIREBASE_FIRESTORE_EMULATOR_PORT: "8282"
        run: bun run build

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: e2e-binaries
          path: .e2e-bin
          include-hidden-files: true
          retention-days: 1

      - name: Upload web export
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-export
          path: apps/web/out
          include-hidden-files: true
          retention-days: 1

  # The Playwright suite dominates wall time, so split it across parallel shards.
  # Each shard is its own runner with its own Docker Compose stack, so adding
  # shards buys wall-clock time without the single-machine contention that keeps
  # in-process workers pinned to 1 (see playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Installed from apps/web, not the repo root: the root package.json is a
      # bun workspace root with no Playwright dependency, so `bunx playwright`
      # there resolves nothing locally and silently downloads an unpinned
      # version from the registry. That installs a browser build for a
      # different Playwright than the one the tests run, and the tests then
      # fail with "Executable doesn't exist". `bun run` uses the workspace's
      # own node_modules/.bin, so the browser always matches the test runner.
      - name: Install Chromium
        working-directory: apps/web
        run: bun run playwright:install

      # Prebuilt API/worker binaries (see the binaries job) that the compose
      # backend/worker exec instead of running `go build` at boot.
      - name: Download prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          name: e2e-binaries
          path: .e2e-bin

      - name: Make binaries executable
        run: chmod +x .e2e-bin/*

      # The prebuilt static export (see the binaries job). E2E_WEB_EXPORT below
      # makes the compose frontend serve this instead of running `next dev`.
      - name: Download web export
        uses: actions/download-artifact@v4
        with:
          name: e2e-web-export
          path: apps/web/out

      # The compose frontend container runs as ${LOCAL_UID:-1000}, but the
      # runner's workspace is owned by uid 1001 — align them or the bind
      # mount is read-only to the container.
      - name: Match compose container uid to runner
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Chromium E2E (PR smoke / main full)
        working-directory: apps/web
        env:
          E2E_WORKER_FIXTURE: "true"
          # Serve the production build, not `next dev`. Playwright starts the
          # compose stack from this step (see webServer in playwright.config.ts),
          # so compose reads it from here.
          E2E_WEB_EXPORT: "true"
        run: |
          shard="--shard=${{ matrix.shard }}/${{ strategy.job-total }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run e2e:pr -- "$shard"
          else
            bun run e2e -- "$shard"
          fi

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  monitor-screenshots:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # As in the e2e job: install with the workspace's own Playwright. This one
      # uses playwright-core, which is what the screenshot script imports.
      - name: Install Chromium
        working-directory: apps/monitor/ui
        run: bun run playwright:install

      - name: Capture monitor screenshots
        working-directory: apps/monitor/ui
        run: bun run screenshots

      - name: Upload monitor screenshots
        uses: actions/upload-artifact@v4
        with:
          name: monitor-screenshots-pr-${{ github.event.pull_request.number }}
          path: docs/monitor-screenshots/*.png
          if-no-files-found: error
          retention-days: 14

  notify:
    needs: [checks, binaries, e2e]
    if: failure()
    uses: ./.github/workflows/notify-discord.yml
    with:
      status: failure
      workflow_name: Web
      job_name: web
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
