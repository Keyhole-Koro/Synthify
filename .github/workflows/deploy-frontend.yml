name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: stage
        options:
          - stage
          - prod
  push:
    branches:
      - stage
      - prod

concurrency:
  group: deploy-frontend-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Resolve env from manual input, else from the pushed branch name
    # (stage/prod). The GitHub Environment scopes secrets and vars so the
    # same names resolve to per-env values.
    environment: ${{ github.event.inputs.environment || github.ref_name }}
    permissions:
      contents: read
      id-token: write

    # `environment:` above is the GitHub Environment — it scopes secrets, it is
    # not a shell variable. Steps that need the environment name need this.
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || github.ref_name }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: apps/web
        run: bun run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_NEW_RELIC_BROWSER_LICENSE_KEY: ${{ vars.NEXT_PUBLIC_NEW_RELIC_BROWSER_LICENSE_KEY }}
          NEXT_PUBLIC_NEW_RELIC_BROWSER_APPLICATION_ID: ${{ vars.NEXT_PUBLIC_NEW_RELIC_BROWSER_APPLICATION_ID }}
          NEXT_PUBLIC_NEW_RELIC_BROWSER_ACCOUNT_ID: ${{ vars.NEXT_PUBLIC_NEW_RELIC_BROWSER_ACCOUNT_ID }}
          NEXT_PUBLIC_NEW_RELIC_BROWSER_TRUST_KEY: ${{ vars.NEXT_PUBLIC_NEW_RELIC_BROWSER_TRUST_KEY }}
          NEXT_PUBLIC_NEW_RELIC_BROWSER_AGENT_ID: ${{ vars.NEXT_PUBLIC_NEW_RELIC_BROWSER_AGENT_ID }}

      # apps/web puts window.__synthifyE2E on the page so Playwright can sign in
      # through the Auth emulator: the app's only sign-in path is Google OAuth,
      # which a test runner cannot drive. The hook signs a user in from anything
      # that can reach the global, so it must not ship. firebase.ts gates it on
      # NODE_ENV; this checks the artifact itself, between build and deploy.
      - name: Assert no test hooks in the bundle
        run: bash scripts/assert-no-test-hooks.sh apps/web/out

      # Keyless auth via Workload Identity Federation, same as deploy-backend.
      # firebase-tools picks up the credentials through the
      # GOOGLE_APPLICATION_CREDENTIALS file exported by the auth action.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      # project id / region は tfvars が持つ。GitHub Variables に同じ事実を置くと、
      # リポジトリを読んでも実効値が分からず、compose と web.yml が離れたのと同じ
      # ずれ方をする。docs/architecture/environment-variables.md の原則3。
      - name: Resolve GCP target from tfvars
        run: |
          set -euo pipefail
          # Assign first, write second. Inside `echo "K=$(...)"` a failing
          # substitution still leaves echo returning 0, so the step succeeds and
          # writes an empty value — which is how a broken ENVIRONMENT surfaced
          # three steps later as "--project argument missing" instead of here.
          project_id="$(bash scripts/tfvar.sh "${ENVIRONMENT}" project_id)"
          region="$(bash scripts/tfvar.sh "${ENVIRONMENT}" region)"
          {
            echo "GCP_PROJECT_ID=${project_id}"
            echo "GCP_REGION=${region}"
          } >> "$GITHUB_ENV"

      - name: Deploy Firestore rules
        run: |
          bunx firebase-tools@13 deploy --only firestore:rules --non-interactive \
            --project ${GCP_PROJECT_ID}

      - name: Deploy to Firebase Hosting
        run: |
          set -o pipefail
          bunx firebase-tools@13 deploy --only hosting --non-interactive --json \
            --project ${GCP_PROJECT_ID} \
            | tee /tmp/firebase-deploy.json

      - name: Resolve Firebase Hosting URL
        run: |
          FRONTEND_URL="$(
            jq -r '
              [
                .result.hosting.url?,
                (.result.hosting[]?.url?),
                (.result.hosting.site? | select(. != null) | "https://" + . + ".web.app"),
                (.result.hosting[]?.site? | select(. != null) | "https://" + . + ".web.app")
              ]
              | map(select(. != null and . != ""))
              | first // empty
            ' /tmp/firebase-deploy.json
          )"
          if [ -z "$FRONTEND_URL" ]; then
            FRONTEND_URL="https://${GCP_PROJECT_ID}.web.app"
          fi
          echo "FRONTEND_URL=${FRONTEND_URL}" >> "$GITHUB_ENV"
          echo "Resolved Firebase Hosting URL: ${FRONTEND_URL}"

      - name: Smoke test Frontend
        run: scripts/smoke-test.sh frontend

  notify:
    needs: deploy
    if: failure()
    uses: ./.github/workflows/notify-discord.yml
    with:
      status: failure
      workflow_name: Deploy Frontend
      job_name: deploy (${{ github.event.inputs.environment || github.ref_name }})
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
