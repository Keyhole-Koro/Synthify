name: E2E External Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      # From apps/web so the browser matches the test runner's Playwright; see
      # the note in web.yml.
      - working-directory: apps/web
        run: bun run playwright:install
      - name: Run explicitly tagged external checks
        working-directory: apps/web
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: bun run e2e:nightly
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
