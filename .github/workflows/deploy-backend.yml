name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: stage
        options:
          - stage
          - prod
  push:
    branches:
      - main
    paths:
      - apps/api/**
      - apps/worker/**
      - packages/shared/**
      - go.mod
      - go.sum
      - .github/workflows/deploy-backend.yml

concurrency:
  group: deploy-backend-${{ github.event.inputs.environment || 'stage' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'stage' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve image registry
        id: registry
        run: |
          REGISTRY="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/synthify-${ENVIRONMENT}"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push API image
        run: |
          docker build \
            -t ${{ steps.registry.outputs.registry }}/api:${{ steps.registry.outputs.sha_tag }} \
            -t ${{ steps.registry.outputs.registry }}/api:latest \
            -f apps/api/Dockerfile .
          docker push ${{ steps.registry.outputs.registry }}/api:${{ steps.registry.outputs.sha_tag }}
          docker push ${{ steps.registry.outputs.registry }}/api:latest

      - name: Build and push Worker image
        run: |
          docker build \
            -t ${{ steps.registry.outputs.registry }}/worker:${{ steps.registry.outputs.sha_tag }} \
            -t ${{ steps.registry.outputs.registry }}/worker:latest \
            -f apps/worker/Dockerfile .
          docker push ${{ steps.registry.outputs.registry }}/worker:${{ steps.registry.outputs.sha_tag }}
          docker push ${{ steps.registry.outputs.registry }}/worker:latest

      # Cloud Run env vars and secrets are managed by Terraform.
      # Here we only roll the image — `--image` updates the running revision
      # without touching env. To change env vars, run terraform apply.
      - name: Deploy API
        run: |
          gcloud run deploy synthify-api-${ENVIRONMENT} \
            --image ${{ steps.registry.outputs.registry }}/api:${{ steps.registry.outputs.sha_tag }} \
            --region ${{ vars.GCP_REGION }} \
            --quiet

      - name: Deploy Worker
        run: |
          gcloud run deploy synthify-worker-${ENVIRONMENT} \
            --image ${{ steps.registry.outputs.registry }}/worker:${{ steps.registry.outputs.sha_tag }} \
            --region ${{ vars.GCP_REGION }} \
            --quiet
