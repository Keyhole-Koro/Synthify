name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: stage
        options:
          - stage
          - prod
  push:
    branches:
      - stage
      - prod

concurrency:
  group: deploy-backend-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Resolve env from manual input, else from the pushed branch name.
    # The GitHub Environment scopes secrets/vars so the same names resolve
    # to per-env values (GCP_WIF_*, GCP_PROJECT_ID, GCP_REGION, ...).
    environment: ${{ github.event.inputs.environment || github.ref_name }}
    permissions:
      contents: read
      id-token: write

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || github.ref_name }}
      TF_DIR: terraform/environments

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Cloud Run proxy component
        run: gcloud components install cloud-run-proxy --quiet

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Resolve image registry
        id: registry
        run: |
          REGISTRY="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/synthify-${ENVIRONMENT}"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "api_image=${REGISTRY}/api:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "worker_image=${REGISTRY}/worker:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "eval_image=${REGISTRY}/eval:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "monitor_image=${REGISTRY}/monitor:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Generate readiness smoke key
        run: |
          READINESS_API_KEY="$(openssl rand -base64 32)"
          echo "::add-mask::${READINESS_API_KEY}"
          echo "READINESS_API_KEY=${READINESS_API_KEY}" >> "$GITHUB_ENV"

      # Upsert the Terraform state bucket. Idempotent: creates it if missing,
      # otherwise just re-asserts versioning/lifecycle. Also (re)writes
      # terraform/backend/<env>.hcl that the init step below consumes.
      - name: Ensure Terraform state bucket
        run: bash scripts/bootstrap-tfstate.sh "${ENVIRONMENT}" "${{ vars.GCP_PROJECT_ID }}" "${{ vars.GCP_REGION }}"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -reconfigure -lockfile=readonly -backend-config=../backend/${ENVIRONMENT}.hcl

      # --- Pass 1: create just the platform layer (Artifact Registry,
      # APIs, service accounts, secrets) so we have a repo to push to.
      # Cloud Run services are NOT created here — they need the image.
      - name: Terraform apply (platform only)
        working-directory: ${{ env.TF_DIR }}
        run: |
          # Pass 1: everything that must exist before images are pushed —
          # platform (SAs, buckets, secrets, registry, queues) plus every
          # deployer IAM grant. All of it lives in module.bootstrap, so this
          # is a single -target. Adding an IAM binding to the module never
          # requires editing this workflow again.
          terraform apply -auto-approve \
            -var-file=../tfvars/${ENVIRONMENT}.tfvars \
            -target=module.bootstrap

      # Fail fast if any secret has no version. We deliberately do NOT inject
      # a placeholder: every one of these is load-bearing (DB, Stripe,
      # inter-service auth, APM) and a placeholder makes Cloud Run start
      # "successfully" while silently broken — exactly the failure mode that
      # took stage down (a missing billing value the app couldn't run without).
      # First deploy of a new project: populate these once via
      #   printf '<value>' | gcloud secrets versions add synthify-<name> \
      #     --project <project> --data-file=-
      # then re-run the pipeline.
      - name: Verify all secrets have a version
        run: |
          missing=()
          for s in database-dsn monitor-database-dsn stripe-secret-key \
                   stripe-webhook-secret new-relic-license-key internal-worker-token \
                   gemini-api-key; do
            name="synthify-${s}"
            existing=$(gcloud secrets versions list "$name" --project "${{ vars.GCP_PROJECT_ID }}" --format="value(name)" --limit=1 2>/dev/null || echo "")
            if [ -z "$existing" ]; then
              echo "::error::secret $name has no version — populate it before deploying"
              missing+=("$name")
            else
              echo "secret $name OK"
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Refusing to deploy: ${#missing[@]} secret(s) unset: ${missing[*]}"
            exit 1
          fi

      - name: Verify required environment variables
        env:
          STRIPE_PRO_PRICE_ID_JPY: ${{ vars.STRIPE_PRO_PRICE_ID_JPY }}
          STRIPE_PRO_PRICE_ID_USD: ${{ vars.STRIPE_PRO_PRICE_ID_USD }}
        run: |
          missing=()
          if [ -z "${STRIPE_PRO_PRICE_ID_JPY}" ] && [ -z "${STRIPE_PRO_PRICE_ID_USD}" ]; then
            missing+=(STRIPE_PRO_PRICE_ID_JPY/STRIPE_PRO_PRICE_ID_USD)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Refusing to deploy: missing required GitHub Environment variable(s): ${missing[*]}"
            exit 1
          fi

      # Run db/migrations/*.up.sql before Cloud Run sees new code, so handlers
      # that depend on a new column/table never start against an old schema.
      # Forward-only; the schema_migrations table records what is applied.
      # Demo data (db/seed/) is intentionally excluded so real environments
      # never get seeded.
      - name: Install golang-migrate
        run: |
          set -euo pipefail
          MIGRATE_VERSION=v4.18.1
          curl -fsSL "https://github.com/golang-migrate/migrate/releases/download/${MIGRATE_VERSION}/migrate.linux-amd64.tar.gz" \
            | tar -xz -C /tmp migrate
          sudo install -m 0755 /tmp/migrate /usr/local/bin/migrate
          migrate -version

      - name: Apply DB migrations
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: bash scripts/apply-db-migrations.sh

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push all four images in parallel. Each uses a GHA-scoped
      # BuildKit cache keyed by image name + environment so pushes to stage
      # and prod never share cache entries.
      - name: Build and push images (parallel)
        run: |
          set -euo pipefail
          pids=()

          docker buildx build \
            --cache-from "type=gha,scope=api-${ENVIRONMENT}" \
            --cache-to   "type=gha,scope=api-${ENVIRONMENT},mode=max" \
            -t "${{ steps.registry.outputs.api_image }}" \
            -t "${{ steps.registry.outputs.registry }}/api:latest" \
            -f apps/api/Dockerfile --push . &
          pids+=($!)

          docker buildx build \
            --cache-from "type=gha,scope=worker-${ENVIRONMENT}" \
            --cache-to   "type=gha,scope=worker-${ENVIRONMENT},mode=max" \
            -t "${{ steps.registry.outputs.worker_image }}" \
            -t "${{ steps.registry.outputs.registry }}/worker:latest" \
            -f apps/worker/Dockerfile --push . &
          pids+=($!)

          docker buildx build \
            --cache-from "type=gha,scope=eval-${ENVIRONMENT}" \
            --cache-to   "type=gha,scope=eval-${ENVIRONMENT},mode=max" \
            -t "${{ steps.registry.outputs.eval_image }}" \
            -t "${{ steps.registry.outputs.registry }}/eval:latest" \
            -f apps/eval/Dockerfile --push . &
          pids+=($!)

          # Monitor is a Next.js app: NEXT_PUBLIC_* are baked into the client
          # bundle at build time, so they are passed as build args (not runtime
          # env). Server-side secrets (MONITOR_DATABASE_URL) stay in Cloud Run.
          docker buildx build \
            --cache-from "type=gha,scope=monitor-${ENVIRONMENT}" \
            --cache-to   "type=gha,scope=monitor-${ENVIRONMENT},mode=max" \
            --build-arg "NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            -t "${{ steps.registry.outputs.monitor_image }}" \
            -t "${{ steps.registry.outputs.registry }}/monitor:latest" \
            -f apps/monitor/ui/Dockerfile --push . &
          pids+=($!)

          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          [ "$failed" -eq 0 ]

      # --- Pass 2: full apply. Images now exist, so Cloud Run services
      # are created/updated with the exact SHA-tagged images. api_base_url
      # stays empty here; it is reconciled in Pass 3.
      #
      # allowed_user_emails: only override when the GitHub Environment var
      # is set. If unset we omit the -var so the tfvars fallback wins
      # (an empty -var would blank out the stage lockdown).
      - name: Terraform apply (full)
        working-directory: ${{ env.TF_DIR }}
        env:
          ALLOWED_USER_EMAILS: ${{ vars.ALLOWED_USER_EMAILS }}
          STRIPE_PRO_PRICE_ID_JPY: ${{ vars.STRIPE_PRO_PRICE_ID_JPY }}
          STRIPE_PRO_PRICE_ID_USD: ${{ vars.STRIPE_PRO_PRICE_ID_USD }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_BROWSER_APP_NAME: ${{ vars.NEW_RELIC_BROWSER_APP_NAME }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          READINESS_MONITOR_KEY: ${{ secrets.READINESS_MONITOR_KEY }}
        run: |
          args=(
            -auto-approve
            -var-file=../tfvars/${ENVIRONMENT}.tfvars
            -var="api_image=${{ steps.registry.outputs.api_image }}"
            -var="worker_image=${{ steps.registry.outputs.worker_image }}"
            -var="eval_image=${{ steps.registry.outputs.eval_image }}"
            -var="monitor_image=${{ steps.registry.outputs.monitor_image }}"
            -var="readiness_api_key=${READINESS_API_KEY}"
            -var="readiness_monitor_key=${READINESS_MONITOR_KEY}"
            -var="stripe_pro_price_id_jpy=${STRIPE_PRO_PRICE_ID_JPY}"
            -var="stripe_pro_price_id_usd=${STRIPE_PRO_PRICE_ID_USD}"
            -var="new_relic_account_id=${NEW_RELIC_ACCOUNT_ID}"
            -var="new_relic_api_key=${NEW_RELIC_API_KEY}"
            -var="new_relic_browser_app_name=${NEW_RELIC_BROWSER_APP_NAME}"
            -var="discord_alert_webhook_url=${DISCORD_ALERT_WEBHOOK_URL}"
          )
          if [ -n "${ALLOWED_USER_EMAILS}" ]; then
            args+=(-var="allowed_user_emails=${ALLOWED_USER_EMAILS}")
          fi
          terraform apply "${args[@]}"

      # --- Pass 3: feed the API URL back so the worker can call it.
      - name: Terraform apply (wire api_base_url)
        working-directory: ${{ env.TF_DIR }}
        env:
          ALLOWED_USER_EMAILS: ${{ vars.ALLOWED_USER_EMAILS }}
          STRIPE_PRO_PRICE_ID_JPY: ${{ vars.STRIPE_PRO_PRICE_ID_JPY }}
          STRIPE_PRO_PRICE_ID_USD: ${{ vars.STRIPE_PRO_PRICE_ID_USD }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_BROWSER_APP_NAME: ${{ vars.NEW_RELIC_BROWSER_APP_NAME }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          READINESS_MONITOR_KEY: ${{ secrets.READINESS_MONITOR_KEY }}
        run: |
          API_URI="$(terraform output -raw api_uri)"
          args=(
            -auto-approve
            -var-file=../tfvars/${ENVIRONMENT}.tfvars
            -var="api_image=${{ steps.registry.outputs.api_image }}"
            -var="worker_image=${{ steps.registry.outputs.worker_image }}"
            -var="eval_image=${{ steps.registry.outputs.eval_image }}"
            -var="monitor_image=${{ steps.registry.outputs.monitor_image }}"
            -var="api_base_url=${API_URI}"
            -var="readiness_api_key=${READINESS_API_KEY}"
            -var="readiness_monitor_key=${READINESS_MONITOR_KEY}"
            -var="stripe_pro_price_id_jpy=${STRIPE_PRO_PRICE_ID_JPY}"
            -var="stripe_pro_price_id_usd=${STRIPE_PRO_PRICE_ID_USD}"
            -var="new_relic_account_id=${NEW_RELIC_ACCOUNT_ID}"
            -var="new_relic_api_key=${NEW_RELIC_API_KEY}"
            -var="new_relic_browser_app_name=${NEW_RELIC_BROWSER_APP_NAME}"
            -var="discord_alert_webhook_url=${DISCORD_ALERT_WEBHOOK_URL}"
          )
          if [ -n "${ALLOWED_USER_EMAILS}" ]; then
            args+=(-var="allowed_user_emails=${ALLOWED_USER_EMAILS}")
          fi
          terraform apply "${args[@]}"

      - name: Outputs
        working-directory: ${{ env.TF_DIR }}
        run: terraform output

      - name: Smoke test API
        working-directory: ${{ env.TF_DIR }}
        run: |
          API_URI="$(terraform output -raw api_uri)"
          API_BASE_URL="${API_URI}" READINESS_API_KEY="${READINESS_API_KEY}" ../../scripts/smoke-test.sh api

      - name: Smoke test Worker
        run: |
          set -euo pipefail
          service_json="$(mktemp)"
          gcloud run services describe "synthify-worker-${ENVIRONMENT}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format=json \
            > "$service_json"

          python3 - "$service_json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              service = json.load(f)

          status = service.get("status", {})
          conditions = status.get("conditions", [])
          ready = next((c for c in conditions if c.get("type") == "Ready"), {})
          latest_created = status.get("latestCreatedRevisionName")
          latest_ready = status.get("latestReadyRevisionName")

          if ready.get("status") != "True":
              print(f"worker service is not Ready: {ready}", file=sys.stderr)
              sys.exit(1)

          if latest_created != latest_ready:
              print(
                  "worker latest revision is not ready: "
                  f"created={latest_created} ready={latest_ready}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"worker service Ready ({latest_ready})")
          PY

  notify:
    needs: deploy
    if: failure()
    uses: ./.github/workflows/notify-discord.yml
    with:
      status: failure
      workflow_name: Deploy Backend
      job_name: deploy (${{ github.event.inputs.environment || github.ref_name }})
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
