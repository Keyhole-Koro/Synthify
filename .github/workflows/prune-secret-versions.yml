name: Prune Secret Versions

on:
  schedule:
    # Run after the weekday deployment window. Secret rotation is uncommon,
    # but this keeps every non-latest version on a bounded lifetime.
    - cron: "23 3 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List candidates without scheduling their destruction
        type: boolean
        required: false
        default: true

concurrency:
  group: prune-secret-versions-${{ matrix.environment }}
  cancel-in-progress: false

jobs:
  prune:
    name: Prune ${{ matrix.environment }} secrets
    strategy:
      fail-fast: false
      matrix:
        environment: [stage, prod]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # The existing environment-scoped WIF identity has Secret Manager admin
      # privileges. No secret value is passed to or read by this workflow.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve GCP target from tfvars
        run: |
          set -euo pipefail
          project_id="$(bash scripts/tfvar.sh '${{ matrix.environment }}' project_id)"
          echo "GCP_PROJECT_ID=${project_id}" >> "$GITHUB_ENV"

      - name: Schedule stale versions for destruction
        env:
          # Scheduled runs prune. Manual runs default to a safe preview.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          # Keep this list aligned with terraform/services/platform/main.tf.
          secret_suffixes=(
            database-dsn
            gemini-api-key
            internal-worker-token
            monitor-database-dsn
            new-relic-license-key
            stripe-secret-key
            stripe-webhook-secret
          )
          required_destroy_ttl="1209600s"

          for suffix in "${secret_suffixes[@]}"; do
            secret="synthify-${suffix}"
            destroy_ttl="$(gcloud secrets describe "${secret}" \
              --project "${GCP_PROJECT_ID}" \
              --format='value(versionDestroyTtl)')"
            if [ "${destroy_ttl}" != "${required_destroy_ttl}" ]; then
              echo "::error::${secret} has versionDestroyTtl=${destroy_ttl:-unset}; refusing to destroy versions"
              exit 1
            fi

            latest_ref="$(gcloud secrets versions describe latest --secret "${secret}" \
              --project "${GCP_PROJECT_ID}" --format='value(name)')"
            latest_version="${latest_ref##*/}"

            while IFS=',' read -r version_ref state scheduled_destroy_time; do
              version="${version_ref##*/}"
              state="${state,,}"

              # Never destroy the version resolved by `latest`, an already
              # destroyed version, or one already waiting for destruction.
              if [ "${version}" = "${latest_version}" ] || \
                 [ "${state}" = "destroyed" ] || \
                 [ -n "${scheduled_destroy_time}" ]; then
                continue
              fi

              if [ "${DRY_RUN}" = "true" ]; then
                echo "Would schedule ${secret} version ${version} (${state}) for destruction"
              else
                echo "Scheduling ${secret} version ${version} (${state}) for destruction"
                gcloud secrets versions destroy "${version}" --secret "${secret}" \
                  --project "${GCP_PROJECT_ID}" --quiet
              fi
            done < <(
              gcloud secrets versions list "${secret}" --project "${GCP_PROJECT_ID}" \
                --format='csv[no-heading](name,state,scheduledDestroyTime)'
            )
          done
