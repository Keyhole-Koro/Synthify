name: Readiness Monitor

on:
  schedule:
    # Every 15 minutes, across stage and prod. At 5 minutes this probe was
    # effectively a keep-alive: Cloud Run holds an idle instance for roughly 15
    # minutes, so it kept one running around the clock in both environments.
    # This is a liveness signal for a sustained outage, not a latency SLO, and
    # it does not need to pay cold-start CPU 288 times a day per environment to
    # be one. Two consecutive misses (the retry below) still surface an outage
    # inside half an hour.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        environment: [stage, prod]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - name: Check readiness (with one retry)
        id: check
        env:
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          READINESS_MONITOR_KEY: ${{ secrets.READINESS_MONITOR_KEY }}
        run: |
          set -uo pipefail

          # Every probe pays a cold start: min_instance_count is 0, and at a
          # 15-minute cadence this workflow is close to the only traffic stage
          # sees, so Cloud Run has almost always scaled to zero by the time we
          # knock. The readiness path then also opens the first DB connection
          # (the pool is lazy) against a CockroachDB Serverless cluster that may
          # itself be resuming from idle. Warm the instance on the shallow
          # /health route first — it starts the container without touching the
          # database — so the timed check below measures readiness rather than
          # start-up. Failures here are expected and ignored; the check decides.
          warm() {
            curl -s --max-time 30 "${API_BASE_URL}/health" > /dev/null 2>&1 || true
          }

          # 25s, not 10s: the budget has to cover the whole cold path (container
          # start, TLS to CockroachDB, first connection, SELECT 1). A warm probe
          # answers in well under a second, so a slow-but-alive service is not
          # what we are trying to catch here — a sustained outage is.
          check() {
            curl -sf --max-time 25 \
              --header "X-Synthify-Readiness-Key: ${READINESS_MONITOR_KEY}" \
              "${API_BASE_URL}/health?ready=1" > /dev/null
          }

          warm

          if check; then
            echo "readiness OK"
            exit 0
          fi

          # 60s rather than 30s: a failed first check usually means something is
          # still coming up, and the retry is only worth anything once that has
          # had time to finish.
          echo "first readiness check failed, retrying in 60s..."
          sleep 60

          if check; then
            echo "readiness OK on retry"
            exit 0
          fi

          echo "readiness check failed twice"
          exit 1

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          ENVIRONMENT: ${{ matrix.environment }}
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          PAYLOAD=$(jq -n \
            --arg title "🔴 Readiness check failed: ${ENVIRONMENT}" \
            --arg description "${API_BASE_URL}/health?ready=1 failed twice (60s apart, 25s timeout each, after a warm-up request)." \
            --arg url "${RUN_URL}" \
            '{
              embeds: [
                {
                  title: $title,
                  description: $description,
                  url: $url,
                  color: 15158332
                }
              ]
            }')

          curl -sf -X POST -H "Content-Type: application/json" -d "${PAYLOAD}" "${DISCORD_WEBHOOK_URL}"
