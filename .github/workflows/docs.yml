name: Docs

# Relative links in Markdown break silently when a file moves or is deleted.
# The check is offline: it reads only the files git tracks and the headings in
# them, never the network, so it takes a second and cannot flake.
on:
  pull_request:
    paths:
      - "**.md"
      - scripts/check-markdown-links.mjs
      - .github/workflows/docs.yml
  push:
    branches:
      - main
    paths:
      - "**.md"
      - scripts/check-markdown-links.mjs
      - .github/workflows/docs.yml

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's own node is enough: the script uses node: built-ins only.
      - name: Check relative links in Markdown
        run: node scripts/check-markdown-links.mjs

  notify:
    needs: [links]
    if: failure()
    uses: ./.github/workflows/notify-discord.yml
    with:
      status: failure
      workflow_name: Docs
      job_name: links
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
