version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "db/init/001_accounts.sql"
      - "db/init/002_workspaces.sql"
      - "db/init/003_documents.sql"
      - "db/init/004_billing.sql"
      - "db/init/005_usage_billing.sql"
      - "db/init/006_jobs.sql"
      - "db/init/007_tree.sql"
      - "db/init/008_credits.sql"
      - "db/init/010_dynamic_tools.sql"
      - "db/init/011_users.sql"
    queries:
      - "db/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "apps/api/internal/repository/postgres/sqlcgen"
        sql_package: "database/sql"
        overrides:
          - column: "document_chunks.embedding"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgvector"
              type: "Vector"
            nullable: true
  - engine: "postgresql"
    schema:
      - "db/init/001_accounts.sql"
      - "db/init/002_workspaces.sql"
      - "db/init/003_documents.sql"
      - "db/init/004_billing.sql"
      - "db/init/005_usage_billing.sql"
      - "db/init/006_jobs.sql"
      - "db/init/007_tree.sql"
      - "db/init/008_credits.sql"
      - "db/init/010_dynamic_tools.sql"
      - "db/init/011_users.sql"
    queries:
      - "db/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "apps/worker/pkg/worker/repository/postgres/sqlcgen"
        sql_package: "database/sql"
        overrides:
          - column: "document_chunks.embedding"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgvector"
              type: "Vector"
            nullable: true
