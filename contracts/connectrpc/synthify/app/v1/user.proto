syntax = "proto3";

package synthify.app.v1;

option go_package = "github.com/synthify/backend/internal/gen/synthify/app/v1;appv1";

service UserService {
  // Firebase Auth ログイン成功後にクライアントから毎回呼ぶ provisioning RPC。
  // users 行を upsert し、account が無ければ作成して無料クレジットを付与する。
  // 冪等。途中失敗 (users 行はあるが accounts が無い等) からも自己回復する。
  rpc SignInUser(SignInUserRequest) returns (SignInUserResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  // 退会。呼んだ本人のアカウントを消す: 自分のワークスペース（文書・ツリー・
  // 共有リンクごと）、他人のワークスペースのメンバーシップ、利用者とアカウントの
  // 行、Firebase Authentication の利用者。有料プランが続いているときと、
  // 処理中の文書があるときは断る。詳細は docs/data-retention.md。
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
}

message User {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  string created_at = 4;
  string last_login_at = 5;
  string account_id = 6;
}

message SignInUserRequest {}  // ID トークンはヘッダで渡す

message SignInUserResponse {
  User user = 1;
  // 今回の呼び出しで account を新規作成したか。
  // users 行があっても accounts が無い回復ケースでも true になる。
  bool is_new_account = 2;
  // 新しい文書と有料プランの受け付けを終えているか（SYNTHIFY_INTAKE_CLOSED）。
  // true のあいだ、アップロード、処理の開始と再開、Checkout は
  // FailedPrecondition（ErrorReason INTAKE_CLOSED）で断られる。
  // 見る・共有する・削除することはできる。
  bool intake_closed = 3;
}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
  repeated string workspace_ids = 2;
}

message DeleteAccountRequest {}

message DeleteAccountResponse {}
