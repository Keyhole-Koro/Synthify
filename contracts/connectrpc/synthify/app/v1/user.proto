syntax = "proto3";

package synthify.app.v1;

option go_package = "github.com/synthify/backend/internal/gen/synthify/app/v1;appv1";

service UserService {
  // Firebase Auth ログイン成功後にクライアントから毎回呼ぶ provisioning RPC。
  // users 行を upsert し、account が無ければ作成して無料クレジットを付与する。
  // 冪等。途中失敗 (users 行はあるが accounts が無い等) からも自己回復する。
  rpc SignInUser(SignInUserRequest) returns (SignInUserResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
}

message User {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  string created_at = 4;
  string last_login_at = 5;
}

message SignInUserRequest {}  // ID トークンはヘッダで渡す

message SignInUserResponse {
  User user = 1;
  // 今回の呼び出しで account を新規作成したか。
  // users 行があっても accounts が無い回復ケースでも true になる。
  bool is_new_account = 2;
}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
  repeated string workspace_ids = 2;
}
