syntax = "proto3";

package synthify.app.v1;

option go_package = "github.com/synthify/backend/internal/gen/synthify/app/v1;appv1";

service WorkspaceService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse);
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);

  // 公開リンク共有。リンクは閲覧専用で課金ゼロ（処理など課金操作は不可）。
  rpc CreateShareLink(CreateShareLinkRequest) returns (CreateShareLinkResponse);
  rpc ListShareLinks(ListShareLinksRequest) returns (ListShareLinksResponse);
  rpc RevokeShareLink(RevokeShareLinkRequest) returns (RevokeShareLinkResponse);
  // token から workspace を解決する無認証経路。フロントの /view/[token] が使う。
  rpc ResolveShareLink(ResolveShareLinkRequest) returns (ResolveShareLinkResponse);
}

message Workspace {
  string workspace_id = 1;
  string name = 2;
  string owner_id = 3;
  WorkspacePlan plan = 4;
  int64 storage_used_bytes = 5;
  int64 storage_quota_bytes = 6;  // plans テーブルから取得して返す
  int64 max_file_size_bytes = 7;
  int64 max_uploads_per_day = 8;
  string created_at = 9;
}

enum WorkspacePlan {
  WORKSPACE_PLAN_UNSPECIFIED = 0;
  WORKSPACE_PLAN_FREE = 1;
  WORKSPACE_PLAN_PRO = 2;
}

message WorkspaceMember {
  string user_id = 1;
  string email = 2;
  WorkspaceRole role = 3;
  bool is_dev = 4;      // /dev/stats アクセス権（role と独立）
  string invited_at = 5;
  string invited_by = 6;
}

enum WorkspaceRole {
  WORKSPACE_ROLE_UNSPECIFIED = 0;
  WORKSPACE_ROLE_EDITOR = 1;
  WORKSPACE_ROLE_VIEWER = 2;
  WORKSPACE_ROLE_OWNER = 3; // workspace 管理者。editor 権限を含む
}

message CreateWorkspaceRequest {
  string name = 1;
}

message CreateWorkspaceResponse {
  Workspace workspace = 1;
}

message GetWorkspaceRequest {
  string workspace_id = 1;
}

message GetWorkspaceResponse {
  Workspace workspace = 1;
  repeated WorkspaceMember members = 2;
}

message ListWorkspacesRequest {}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message UpdateWorkspaceRequest {
  string workspace_id = 1;
  string name = 2;
}

message UpdateWorkspaceResponse {
  Workspace workspace = 1;
}

message InviteMemberRequest {
  string workspace_id = 1;
  string email = 2;
  WorkspaceRole role = 3;
  bool is_dev = 4;
}

message InviteMemberResponse {
  WorkspaceMember member = 1;
}

message UpdateMemberRoleRequest {
  string workspace_id = 1;
  string user_id = 2;
  WorkspaceRole role = 3;
  bool is_dev = 4;
}

message UpdateMemberRoleResponse {
  WorkspaceMember member = 1;
}

message RemoveMemberRequest {
  string workspace_id = 1;
  string user_id = 2;
}

message RemoveMemberResponse {}

message TransferOwnershipRequest {
  string workspace_id = 1;
  string new_owner_user_id = 2;
}

message TransferOwnershipResponse {
  Workspace workspace = 1;
  repeated WorkspaceMember members = 2;
}

message DeleteWorkspaceRequest {
  string workspace_id = 1;
}

message DeleteWorkspaceResponse {}

// --- Share links (public link sharing) ---------------------------------

// 公開リンク。token を知っていれば無認証で閲覧できる。
// role は閲覧専用に限定する想定（課金操作は招待メンバーのみ）。
message ShareLink {
  string token = 1;
  string workspace_id = 2;
  WorkspaceRole role = 3;
  string created_by = 4;
  string created_at = 5;
  string expires_at = 6;  // 空文字なら無期限
  bool revoked = 7;
}

message CreateShareLinkRequest {
  string workspace_id = 1;
  WorkspaceRole role = 2;  // 未指定なら VIEWER 扱い
  string expires_at = 3;   // 空文字なら無期限
}

message CreateShareLinkResponse {
  ShareLink link = 1;
}

message ListShareLinksRequest {
  string workspace_id = 1;
}

message ListShareLinksResponse {
  repeated ShareLink links = 1;
}

message RevokeShareLinkRequest {
  string workspace_id = 1;
  string token = 2;
}

message RevokeShareLinkResponse {}

// 無認証で呼ばれる。token のみを受け取り、有効なら workspace を返す。
message ResolveShareLinkRequest {
  string token = 1;
}

message ResolveShareLinkResponse {
  Workspace workspace = 1;
  WorkspaceRole role = 2;
}
