syntax = "proto3";

package synthify.app.v1;

option go_package = "github.com/synthify/backend/internal/gen/synthify/app/v1;appv1";

// Shared primitive used across multiple domains.
message DocumentChunk {
  string document_id = 1;
  string chunk_id = 2;
  int64 chunk_index = 3;
  string text = 4;
  string source_filename = 5;
  int64 source_page = 6;
  int64 source_offset_start = 7;
  int64 source_offset_end = 8;
}

// ErrorDetail travels as a Connect error detail, so the web can tell why the
// API refused a request without matching on the message text.
message ErrorDetail {
  ErrorReason reason = 1;
}

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  // The service no longer takes new documents or paid plans
  // (SYNTHIFY_INTAKE_CLOSED). Comes with FailedPrecondition; retrying does
  // not help until an operator reopens intake.
  ERROR_REASON_INTAKE_CLOSED = 1;
}
