syntax = "proto3";

package synthify.app.v1;

option go_package = "github.com/synthify/backend/internal/gen/synthify/app/v1;appv1";

// Core tree data types shared across tree, item, and related services.

message Item {
  string id = 1;
  string title = 2;
  int32 level = 3;
  string description = 4;
  string content = 5;
  string created_at = 6;
  TreeProjectionScope scope = 7;
  string parent_id = 8;
  repeated string child_ids = 9;
  ItemGovernanceState governance_state = 10;
  string override_css = 11;
  // kind identifies the structural role of this item in its workspace
  // tree. The frontend used to derive this by inspecting parent_id and
  // walking children of the inferred root; serving it explicitly lets
  // both backend and frontend reason about the role directly.
  ItemKind kind = 12;
}

message Tree {
  string workspace_id = 1;
  string document_id = 2;
  repeated Item items = 3;
  bool cross_document = 5;
}

enum TreeProjectionScope {
  TREE_PROJECTION_SCOPE_UNSPECIFIED = 0;
  TREE_PROJECTION_SCOPE_DOCUMENT = 1;
  TREE_PROJECTION_SCOPE_CANONICAL = 2;
}

enum ItemGovernanceState {
  ITEM_GOVERNANCE_STATE_UNSPECIFIED = 0;
  ITEM_GOVERNANCE_STATE_SYSTEM_GENERATED = 1;
  ITEM_GOVERNANCE_STATE_PENDING_REVIEW = 2;
  ITEM_GOVERNANCE_STATE_HUMAN_CURATED = 3;
  ITEM_GOVERNANCE_STATE_LOCKED = 4;
}

enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  ITEM_KIND_NODE = 1;
  ITEM_KIND_WORKSPACE_ROOT = 2;
  ITEM_KIND_DOCUMENT_ROOT = 3;
}

message SubtreeItem {
  Item item = 1;
  bool has_children = 2;
}
