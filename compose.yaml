name: synthify-dev

services:
  frontend:
    image: oven/bun:1
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace/apps/web
    command: >
      bash -c '
        set -e;
        if [ ! -f /workspace/apps/web/package.json ]; then
          echo "apps/web/package.json not found. Waiting for web implementation...";
          sleep infinity;
        fi;
        if [ ! -x /workspace/apps/web/node_modules/.bin/next ]; then
          cd /workspace;
          bun install --frozen-lockfile;
        fi;
        mkdir -p /workspace/node_modules;
        ln -sfn /workspace/apps/web/node_modules/next /workspace/node_modules/next;
        cd /workspace/apps/web;
        rm -rf .next;
        bun run dev
      '
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-demo-api-key}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-demo-synthify}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-demo-synthify.firebaseapp.com}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-demo-synthify.appspot.com}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-1234567890}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-1:1234567890:web:demo-synthify}
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL: ${NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL:-http://127.0.0.1:${FIREBASE_AUTH_PORT:-9099}}
      NEXT_PUBLIC_FIREBASE_FIRESTORE_EMULATOR_HOST: ${NEXT_PUBLIC_FIREBASE_FIRESTORE_EMULATOR_HOST:-127.0.0.1}
      NEXT_PUBLIC_FIREBASE_FIRESTORE_EMULATOR_PORT: ${NEXT_PUBLIC_FIREBASE_FIRESTORE_EMULATOR_PORT:-${FIREBASE_FIRESTORE_PORT:-8282}}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://host.docker.internal:${BACKEND_PORT:-8080}}
      WATCHPACK_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/workspace

  backend:
    image: golang:1.25-bookworm
    network_mode: host
    working_dir: /workspace
    command: >
      bash -c '
        if [ ! -f go.mod ]; then
          echo "go.mod not found. Waiting for Go implementation...";
          sleep infinity;
        fi;
        go build -buildvcs=false -o /tmp/synthify-api ./apps/api/cmd/server &&
        exec /tmp/synthify-api
      '
    environment:
      SERVICE_MODE: api
      PATH: /usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      ENV: local
      PORT: "${BACKEND_PORT:-8080}"
      CORS_ALLOWED_ORIGINS: "*"
      GCP_PROJECT_ID: synthify-local
      GCS_BUCKET: synthify-uploads
      GCS_EMULATOR_HOST: http://127.0.0.1:${GCS_PORT:-4443}
      STORAGE_EMULATOR_HOST: http://127.0.0.1:${GCS_PORT:-4443}
      GCS_UPLOAD_URL_BASE: ${GCS_UPLOAD_URL_BASE:-http://localhost:${GCS_PORT:-4443}}
      INTERNAL_GCS_UPLOAD_URL_BASE: ${INTERNAL_GCS_UPLOAD_URL_BASE:-http://127.0.0.1:${GCS_PORT:-4443}}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-synthify}
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:${FIREBASE_AUTH_PORT:-9099}
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:${FIREBASE_FIRESTORE_PORT:-8282}
      DATABASE_DSN: postgres://synthify:synthify@127.0.0.1:${POSTGRES_PORT:-5432}/synthify?sslmode=disable
      WORKER_BASE_URL: ${WORKER_BASE_URL:-http://127.0.0.1:${WORKER_PORT:-8081}}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID_JPY: ${STRIPE_PRO_PRICE_ID_JPY:-}
      STRIPE_PRO_PRICE_ID_USD: ${STRIPE_PRO_PRICE_ID_USD:-}
      STRIPE_DEFAULT_CURRENCY: ${STRIPE_DEFAULT_CURRENCY:-jpy}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-http://localhost:${FRONTEND_PORT:-5173}?billing=success}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-http://localhost:${FRONTEND_PORT:-5173}?billing=cancel}
      BILLING_PORTAL_RETURN_URL: ${BILLING_PORTAL_RETURN_URL:-http://localhost:${FRONTEND_PORT:-5173}}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      GEMINI_CACHE_ENABLED: "true"
      GEMINI_CACHE_DIR: /workspace/.gemini-cache
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_API_APP_NAME:-synthify-api-local}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/synthify-api"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      - .:/workspace
      - go-pkg-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - gemini-cache:/workspace/.gemini-cache
    depends_on:
      postgres:
        condition: service_healthy
      gcs-init:
        condition: service_completed_successfully
      firebase-auth:
        condition: service_started

  worker:
    image: golang:1.25-bookworm
    network_mode: host
    working_dir: /workspace
    command: >
      bash -c '
        if [ ! -f go.mod ]; then
          echo "go.mod not found. Waiting for Go implementation...";
          sleep infinity;
        fi;
        go build -buildvcs=false -o /tmp/synthify-worker ./apps/worker/cmd/server &&
        exec /tmp/synthify-worker
      '
    environment:
      SERVICE_MODE: worker
      PATH: /usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      ENV: local
      PORT: "${WORKER_PORT:-8081}"
      GCP_PROJECT_ID: synthify-local
      GCS_BUCKET: synthify-uploads
      GCS_EMULATOR_HOST: http://127.0.0.1:${GCS_PORT:-4443}
      STORAGE_EMULATOR_HOST: http://127.0.0.1:${GCS_PORT:-4443}
      GCS_UPLOAD_URL_BASE: ${GCS_UPLOAD_URL_BASE:-http://localhost:${GCS_PORT:-4443}}
      INTERNAL_GCS_UPLOAD_URL_BASE: ${INTERNAL_GCS_UPLOAD_URL_BASE:-http://127.0.0.1:${GCS_PORT:-4443}}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-synthify}
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:${FIREBASE_AUTH_PORT:-9099}
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:${FIREBASE_FIRESTORE_PORT:-8282}
      DATABASE_DSN: postgres://synthify:synthify@127.0.0.1:${POSTGRES_PORT:-5432}/synthify?sslmode=disable
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      GEMINI_CACHE_ENABLED: "true"
      GEMINI_CACHE_DIR: /workspace/.gemini-cache
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_WORKER_APP_NAME:-synthify-worker-local}
      GCS_FUSE_MOUNT_PATH: /mnt/gcs/synthify-uploads
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/synthify-worker"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      - .:/workspace
      - gcs-data:/mnt/gcs:ro
      - go-pkg-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - gemini-cache:/workspace/.gemini-cache
    depends_on:
      postgres:
        condition: service_healthy
      gcs-init:
        condition: service_completed_successfully
      firebase-auth:
        condition: service_started

  monitor:
    image: oven/bun:1
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: host
    working_dir: /workspace/apps/monitor/ui
    command: >
      bash -c '
        set -e;
        if [ ! -x /workspace/node_modules/.bin/next ]; then
          cd /workspace;
          bun install --frozen-lockfile;
        fi;
        cd /workspace/apps/monitor/ui;
        bun run dev
      '
    environment:
      NODE_ENV: development
      # monitor は Postgres を read-only ロールで直接参照する。
      MONITOR_DATABASE_URL: ${MONITOR_DATABASE_URL:-postgres://monitor@127.0.0.1:${POSTGRES_PORT:-5432}/synthify?sslmode=disable}
    volumes:
      - .:/workspace
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  dev-health:
    image: curlimages/curl:8.13.0
    network_mode: host
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      worker:
        condition: service_started
      postgres-init:
        condition: service_completed_successfully
      gcs-init:
        condition: service_completed_successfully
      firebase-auth:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:${FRONTEND_PORT:-5173}/ >/dev/null && curl -fsS http://127.0.0.1:${BACKEND_PORT:-8080}/health >/dev/null && curl -fsS http://127.0.0.1:${WORKER_PORT:-8081}/health >/dev/null && curl -fsS http://127.0.0.1:${POSTGRES_ADMIN_PORT:-8082}/health?ready=1 >/dev/null && curl -fsS http://127.0.0.1:${GCS_PORT:-4443}/storage/v1/b >/dev/null && curl -sS http://127.0.0.1:${FIREBASE_AUTH_PORT:-9099}/ >/dev/null && curl -sS http://127.0.0.1:${FIREBASE_FIRESTORE_PORT:-8282}/ >/dev/null"
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 5s

  postgres:
    image: cockroachdb/cockroach:latest-v24.2
    command: start-single-node --insecure
    ports:
      - "${POSTGRES_PORT:-5432}:26257"
      - "${POSTGRES_ADMIN_PORT:-8082}:8080"
    volumes:
      - postgres-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-init:
    image: cockroachdb/cockroach:latest-v24.1
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/seed:/seed:ro
    entrypoint: ["sh", "-c"]
    command: >
      "
        cockroach sql --insecure --host=127.0.0.1:${POSTGRES_PORT:-5432} -e \"CREATE USER IF NOT EXISTS synthify; CREATE DATABASE IF NOT EXISTS synthify; GRANT ALL ON DATABASE synthify TO synthify;\" &&
        for f in /migrations/*.up.sql; do
          echo \"Applying migration \$$f...\"
          cockroach sql --insecure --host=127.0.0.1:${POSTGRES_PORT:-5432} --user=synthify --database=synthify < \"\$$f\"
        done &&
        for f in /seed/*.sql; do
          [ -f \"\$$f\" ] || continue
          echo \"Loading seed \$$f...\"
          cockroach sql --insecure --host=127.0.0.1:${POSTGRES_PORT:-5432} --user=synthify --database=synthify < \"\$$f\"
        done
      "

  gcs:
    image: fsouza/fake-gcs-server:1.52
    command:
      - -scheme
      - http
      - -port
      - "4443"
      - -public-host
      - localhost:${GCS_PORT:-4443}
      - -external-url
      - http://localhost:${GCS_PORT:-4443}
      - -data
      - /data
      - -cors-headers
      - Content-Type
    environment:
      - GCS_STORAGE_PATH=/data
    ports:
      - "${GCS_PORT:-4443}:4443"
    volumes:
      - gcs-data:/data
    depends_on:
      gcs-volume-init:
        condition: service_completed_successfully

  gcs-volume-init:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /data/synthify-uploads"]
    volumes:
      - gcs-data:/data

  gcs-init:
    image: curlimages/curl:8.13.0
    network_mode: host
    depends_on:
      gcs:
        condition: service_started
    command: >
      sh -c '
        set -eu;
        until curl -fsS "http://127.0.0.1:${GCS_PORT:-4443}/storage/v1/b" > /dev/null; do
          sleep 1;
        done;
        curl -fsS -X POST "http://127.0.0.1:${GCS_PORT:-4443}/storage/v1/b?project=synthify-local" \
          -H "Content-Type: application/json" \
          -d "{\"name\":\"synthify-uploads\"}" > /dev/null 2>&1 || true
      '

  firebase-auth:
    build:
      context: ./docker/firebase-emulator
    working_dir: /workspace
    command: firebase emulators:start --only auth,firestore --project demo-synthify
    environment:
      FIRESTORE_EMULATOR_HOST: 0.0.0.0:8282
    ports:
      - "${FIREBASE_AUTH_PORT:-9099}:9099"
      - "${FIREBASE_FIRESTORE_PORT:-8282}:8282"
    volumes:
      - .:/workspace

volumes:
  go-pkg-cache:
  go-build-cache:
  postgres-data:
  gcs-data:
  gemini-cache:
